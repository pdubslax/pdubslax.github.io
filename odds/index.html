<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Live Fantasy Odds</title>

<link rel="icon" type="image/png" sizes="32x32" href="/odds/favicon-32.png?v=2">

<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: scoreboard wall. One header strip, a punishment panel (blowout race + shotgun watch), then a grid of matchup tiles that stack on phones. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --fav:#1d4ed8; --fav-soft:#e8eefc; --dog:#6b7280; --dog-soft:#f3f4f6; --up:#1d4ed8; --down:#9ca3af; --grid:#f3f4f7;
  --risk:#b45309; --risk-soft:#fff3e0; --lock:#b91c1c; --lock-soft:#fdecec; --win:#15803d; --win-soft:#e6f4ea; --alt:#b7791f; --alt-soft:#fdf0c2;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:grid;gap:2px;text-align:right}
.meta b{color:var(--ink);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--fav);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.tile .lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile .who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
a.card{color:inherit;text-decoration:none;cursor:pointer}
a.card:hover{border-color:var(--fav)}
.nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 16px 10px;display:grid;gap:6px;min-width:0;grid-template-rows:auto auto 1fr auto;container-type:inline-size}  /* cards in a row share a height: only the chart row absorbs the difference, so headers and pcts stay level */
.rowtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:22px}
.rowtop .chip{flex:none} .rowtop span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}  /* one line always, so every card's strip starts at the same height */
.rowtop b{color:var(--ink);font-weight:500}
.card.done .rowtop b{color:var(--win)}
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;column-gap:14px}  /* top-aligned so the pct sits at the same height on every card, whatever the player list's length */
.strip .pct,.strip .mid{margin-top:3px}
.strip .mid{min-width:0;display:grid;gap:1px}
.strip .key{font-size:12px;color:var(--muted);text-align:right;line-height:1.4;padding-left:4px;min-height:5.6em}  /* room for the count line plus three players, so strips and charts line up across cards */
.strip .key b{display:block;font-family:var(--mono);font-weight:500;color:var(--ink);font-size:12px}
.strip .key em{font-style:normal;font-family:var(--mono);font-size:11.5px;margin-left:6px;color:var(--muted)}
.strip .key em.up{color:var(--win)} .strip .key em.down{color:var(--lock)}
.strip .key span{display:block;white-space:nowrap}
.card.done .key em.up{color:var(--win)}
.strip .pct{min-width:64px}
.strip .nm{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.strip .rec{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.strip .pct{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.strip .pct small{font-size:16px;font-weight:600}
.strip .sub{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.strip .sub span{white-space:nowrap}  /* "now" and "proj" each stay whole; a squeezed line breaks between them, never into the player column */
.strip .sub b{color:var(--ink);font-weight:500}
.strip.top .pct,.strip.top .nm{color:var(--fav)} .strip.bot .pct,.strip.bot .nm{color:var(--alt)}
.strip.bot{border-top:1px solid var(--line);padding-top:8px}
.strip.top{padding-bottom:2px}
.chart{position:relative;touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}  /* sideways drags scrub the chart, vertical ones still scroll the page */
.chart svg{width:100%;height:96px;display:block;max-width:100%}
.chart svg *{pointer-events:none}
.chart .tip{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel);padding:1px 5px;border:1px solid var(--line);border-radius:3px;pointer-events:none;display:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .guide{display:none}
.cap{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.delta{font-weight:500}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.chip{display:inline-block;font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--fav-soft);color:var(--fav)}
.chip.lock{background:var(--win-soft);color:var(--win)}
.card.done{--fav:var(--win);--fav-soft:#cfe9d6;--alt:var(--win);--alt-soft:#cfe9d6;--grid:#e3f3e7;--dog-soft:#e3ebe5;--line:#bfe0c8;background:#f1faf3;border-color:#bfe0c8}
.card.done .chip.lock{background:#d6efdc}
.card.done .rowtop{color:var(--win)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.empty{background:var(--panel);border:1px dashed var(--line);padding:28px;text-align:center;color:var(--muted)}
.shot{background:var(--panel);border:1px solid var(--line);padding:12px 16px;display:grid;gap:8px;min-width:0}
.shot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.shot .lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.shot .note{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.shot .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px 28px}
.shot .blow li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:10px}
.shot .blow .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;min-width:64px}
.shot .blow li:first-child .big{font-size:34px}
.shot .blow .who{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot .blow li:first-child .who{color:var(--ink);font-weight:600;font-size:14px}
.shot .col{min-width:0;display:grid;gap:6px;align-content:start}
.shot .col .lab{display:flex;align-items:center;gap:8px}
.shot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media (max-width:680px){.shot .cols{grid-template-columns:1fr}}
.shot li{font-size:14px;border-top:1px solid var(--line);padding-top:6px;min-width:0}
.shot .who{font-weight:600;overflow-wrap:anywhere}
.shot .who small{font-weight:400;color:var(--muted);font-size:12.5px}
.shot .pts{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.chip.risk{background:var(--risk-soft);color:var(--risk)} .chip.beer{background:var(--lock-soft);color:var(--lock)}
.shot .none{color:var(--muted);font-size:14px}
.shot em.down{font-style:normal;color:var(--lock);font-family:var(--mono);font-size:12px}
/* Top band. Wide screens: punishment watch on the left half, projected standings on the right, above the matchup cards. Narrower
   screens stack the same order: punishment watch, standings, then the cards. A view without standings (.solo) is just the watch. */
.band{display:contents}
@media (min-width:1001px){
  .band:not(.solo){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .band:not(.solo) .shot{align-content:start}
  .band:not(.solo) .shot .cols{grid-template-columns:1fr;gap:16px}
  .band:not(.solo) .stand{max-width:none;align-content:start}
}
/* Projected standings: one list of twelve, capped in width so the eye does not have to cross the whole page from name to points. */
.stand{background:var(--panel);border:1px solid var(--line);padding:10px 16px;display:grid;gap:6px;min-width:0;max-width:600px;container-type:inline-size}
.stand:empty{display:none}
.stand .hd{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.stand .lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stand .note{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.stand table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.stand th{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 3px;white-space:nowrap}
.stand td{border-top:1px solid var(--line);padding:3px 0;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  /* compact rows: twelve teams should not push the cards far down the page */
.stand .rk{width:24px;font-family:var(--mono);color:var(--muted)}
.stand .mv{width:30px;font-family:var(--mono);font-size:11px}
.stand .mv.up{color:var(--win)} .stand .mv.down{color:var(--lock)}
.stand td.nm{font-weight:600;padding-right:6px} .stand th.nm{width:104px}  /* names are short: the spare width goes to the label gutter on the right */
.stand .rec{width:56px;font-family:var(--mono)} .stand td.rec{font-weight:500}
.stand .res{width:48px;font-family:var(--mono);font-size:12px}
.stand td.res.W{color:var(--win)} .stand td.res.L{color:var(--lock)}
.stand .num{width:78px;text-align:right;font-family:var(--mono)} .stand td.num{font-size:12px} .stand th.num{padding-right:4px}
/* Every number carries the same padding so the digits stay aligned; only the best and worst in a column get the tint. */
.stand td.num span{padding:1px 4px;border-radius:3px}
.stand td.num .hi{background:var(--win-soft);color:var(--win)} .stand td.num .lo{background:var(--lock-soft);color:var(--lock)}
/* Cutoff lines take no height of their own, so every row keeps the same rhythm. The label sits on the line in the empty gutter to the
   right of the numbers (the last, flexible column), never over them. Where the panel is too narrow for a gutter, the labels give way to
   a sentence in the note. */
.stand .cut td{border-top:1px solid var(--ink);padding:0;height:0;line-height:0;overflow:visible;position:relative}
.stand .cut span{position:absolute;right:0;top:-.5px;transform:translateY(-50%);background:var(--panel);padding-left:8px;font-family:var(--display);font-size:10.5px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stand .note .sm{display:none}
@container (max-width:519px){
  .stand .cut span{display:none}
  .stand th.tag{width:0}  /* kept as a zero-width column: hiding it would leave the lines' colspan to invent a column that steals width from the names */
  .stand th.nm{width:auto}
  .stand .note .sm{display:inline}
}
.stand .cut + tr td{border-top:0}
@media (max-width:680px){
  .stand .rk{width:20px} .stand .mv{width:22px} .stand .rec{width:38px} .stand .res{width:36px} .stand .num{width:56px} .stand td.num{font-size:12px}
  .stand th{letter-spacing:.04em} .stand th .lg{display:none}
}
.meta .crumbs a{color:var(--fav);text-decoration:none;font-weight:500}
.meta .crumbs b{color:var(--ink)}
.meta .crumbs .wk{color:var(--muted);margin-right:2px}
.meta .crumbs a:hover{text-decoration:underline}
/* A narrow card (the tight end of the two- and three-column grids) has no room for the key-player column beside the name and scores,
   so it drops below them as a wrapping row, as on phones. Two lines stay reserved so strips and charts still line up across a row. */
@container (max-width:370px){
  .strip{grid-template-columns:auto minmax(0,1fr);row-gap:4px}
  .strip .key{grid-column:1/-1;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;align-content:start;gap:2px 12px;padding-left:0;min-height:3em}
  .strip .key b{display:inline;margin-right:4px}
}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){
  .grid{grid-template-columns:1fr}.meta{text-align:left}
  /* Phones: the key-player column drops below the name and stats as a wrapping row instead of fighting them for width. */
  .strip{grid-template-columns:auto minmax(0,1fr);row-gap:4px}
  .strip .key{grid-column:1/-1;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding-left:0;min-height:0}
  .strip .key b{display:inline;margin-right:4px}
  .strip .key span{white-space:nowrap}
  .strip .sub{white-space:normal}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div><p class="eyebrow">Harry Koch Memorial Cup</p><h1>Live Fantasy Odds</h1></div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="band" id="band">
    <section class="shot" id="shot" aria-label="Punishment watch"></section>
    <section class="stand" id="stand" aria-label="Projected standings"></section>
  </div>
  <section class="grid" id="grid" aria-label="Matchups"></section>
  <footer><span>Win odds and projections are Yahoo's, sampled about once a minute during game windows. This page refreshes itself.</span></footer>
</div>
<script>
const REPO = 'pdubslax/pdubslax.github.io';
const REF_URL = 'https://api.github.com/repos/' + REPO + '/commits/odds-data';
// The data branch through its two mirrors: jsDelivr by commit (fresh the moment the commit exists), and GitHub's own raw host by commit or branch.
const jsd = (sha, f) => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/data/odds/' + f;
const raw = (ref, f) => 'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/data/odds/' + f;
// Each week exists in two forms. The slim one (live.json for the current week, weekN.lite.json for any week) is a few KB on the wire and
// is what this page polls. The full one (current.json, weekN.json) repeats every starter in every sample, about 17 MB to parse, and is
// read only when the slim file is missing: weeks recorded before the slim files, or a sampler run that started before them.
const LIVE_FILES = ['live.json', 'current.json'], weekFiles = w => ['week' + w + '.lite.json', 'week' + w + '.json'];
let lastSha = null, lastJson = null, apiBlockedUntil = 0;
const FIRST_WEEK = 6;            // first week the sampler recorded
let latest = null;               // {hist, nxt, sha} from the newest data commit
let viewWeek = (location.hash.match(/^#week(\d+)$/)||[])[1] ? parseInt(RegExp.$1, 10) : null;  // a past week the viewer picked, else auto
const pastCache = {};
async function fetchJson(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
// The first address that answers with JSON; the last error if none does.
async function firstJson(urls){ let err = new Error('no source'); for (const u of urls) { try { return await fetchJson(u); } catch(e) { err = e; } } throw err; }
// Samples of a finished matchup taken before the sampler learned Yahoo's result layout carry null players-remaining and a stale 99/1.
// Count what is left from the starters list instead, and call the game for whoever is ahead when nobody is left on either side.
function heal(hist){
  const left = a => (a||[]).filter(x => x.state==='live' || x.state==='pending').length;
  for (const s of [...(hist.samples||[]), hist.last, hist.preview]) for (const m of (s && s.matchups) || []) {
    if (m.leftRem != null && m.rightRem != null) continue;
    const both = m.leftRem == null && m.rightRem == null;
    if (m.leftRem == null) m.leftRem = left(m.leftActive);
    if (m.rightRem == null) m.rightRem = left(m.rightActive);
    if (both && m.leftRem === 0 && m.rightRem === 0 && m.leftScore !== m.rightScore && m.leftScore + m.rightScore > 0) m.leftPct = m.leftScore > m.rightScore ? 100 : 0;
  }
  return hist;
}
// A downloaded week, in either form, as render() reads it: healed, with a samples list. The slim form carries the latest sample in full
// plus, for the chart, every sample's time and each matchup's left-team odds (already healed by the sampler); the earlier samples are
// rebuilt here with just those, which is all render() takes from them.
function unpack(d){
  heal(d); if (!d.series) return d;
  const {series, last, ...rest} = d, ids = Object.keys(series.pct);
  const samples = series.ts.map((t, i) => ({ts: t * 1000, matchups: ids.filter(id => series.pct[id][i] != null).map(id => ({id, leftPct: series.pct[id][i]}))}));
  if (last && samples.length) samples[samples.length-1] = last;
  return {...rest, samples};
}
function show(hist, nxt, sha){ latest = {hist: unpack(hist), nxt, sha: sha || (latest && latest.sha)}; renderView(); }
// Decide what the board shows: a past week the viewer picked, the upcoming week once the current one is fully decided, or the live week.
async function renderView(){
  if (!latest) return;
  const {hist, nxt, sha} = latest;
  const lastS = hist.samples && hist.samples[hist.samples.length-1];
  const allDone = lastS && lastS.matchups.every(decidedOf);
  // The highest week the breadcrumb lists: the week ahead once the current one is settled and previewed, else the current week.
  const hasNext = allDone && nxt && nxt.week > hist.week && (nxt.matchups||[]).length;
  const topWeek = hasNext ? nxt.week : hist.week;
  if (viewWeek && viewWeek === hist.week) { renderOnce(hist, allDone ? 'past' : 'live', topWeek); return; }
  // A week that has not kicked off yet carries a preview snapshot instead of samples.
  if ((!hist.samples || !hist.samples.length) && hist.preview && !viewWeek) { renderOnce({...hist, samples: [hist.preview]}, 'upcoming', hist.week); return; }
  if (viewWeek && viewWeek !== hist.week) {
    const want = viewWeek; let past = pastCache[want];
    if (!past) {
      // By commit through the CDN when the latest commit is known; otherwise straight from the data branch, so a rate-limited
      // GitHub API (60 calls an hour per network) never leaves the week links dead.
      try { past = unpack(await firstJson(weekFiles(want).flatMap(f => [sha && jsd(sha, f), raw('odds-data', f)]).filter(Boolean))); pastCache[want] = past; } catch(e) {}
      if (viewWeek !== want) return;  // the viewer picked another week while this one was downloading; that pick has its own render
    }
    if (past) { renderOnce(past, 'past', topWeek); return; }
    viewWeek = null; history.replaceState(null, '', location.pathname);
  }
  if (hasNext) {
    const shift = 7*86400000, mv = s => new Date(new Date(s).getTime() + shift).toISOString();
    const up = {week: nxt.week, samples: [{ts: nxt.ts, week: nxt.week, matchups: nxt.matchups}], windows: nxt.windows,
                base: hist.base && hist.base.through === hist.week - 1 ? advance(hist.base, lastS.matchups) : null,  // this week's results carried into the week ahead
                segments: (hist.segments||[]).map(g => ({...g, start: mv(g.start), end: mv(g.end)})), ticks: (hist.ticks||[]).map(k => ({at: mv(k.at)}))};
    renderOnce(up, 'upcoming', topWeek); return;
  }
  renderOnce(hist, 'live', topWeek);
}
function renderOnce(hist, mode, curWeek){ const txt = JSON.stringify([hist, mode, viewWeek]); if (txt === lastJson) return; lastJson = txt; render(hist, mode, curWeek); }
function pickWeek(w){ if (latest && w && w > latest.hist.week) w = null;  // the week ahead has no file of its own; it is the automatic view
  viewWeek = w; lastJson = null; history.replaceState(null, '', w ? '#week' + w : location.pathname); renderView(); }
const decidedOf = m => { const lp = m.leftPct; const leftAhead = m.leftScore > m.rightScore, rightAhead = m.rightScore > m.leftScore;
  // Out of reach on paper: at 99/1, the trailing side's deficit is more than one and a half times what its remaining players are projected
  // to score, so a big game from what is left still would not be enough.
  const remProj = side => ((side === 'left' ? m.leftActive : m.rightActive) || []).filter(a => a.state === 'live' || a.state === 'pending').reduce((s,a) => s + (a.rem || 0), 0);

    const ext = k => { const v = now.map(t => t[k]); return [Math.max(...v), Math.min(...v)]; };
    const [pfMax, pfMin] = ext('pf'), [paMax, paMin] = ext('pa');
    const mark = (v, good, bad, what) => v === good ? ` class="hi" title="${what[0]}"` : v === bad ? ` class="lo" title="${what[1]}"` : '';
    const head = `<thead><tr><th class="rk">#</th><th class="mv"></th><th class="nm">Manager</th><th class="rec">Rec<span class="lg">ord</span></th><th class="res">Wk ${hist.week}</th><th class="num">PF</th><th class="num">PA</th><th class="tag"></th></tr></thead>`;
    // The arrow is the move from where the team stood entering the week.
    const row = (t, i) => { const mv = was[t.id] - (i + 1);
      return `<tr><td class="rk">${i + 1}</td><td class="mv ${mv > 0 ? 'up' : mv < 0 ? 'down' : ''}">${mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : ''}</td><td class="nm">${esc(MANAGERS[t.id] || 'Team ' + t.id)}</td><td class="rec">${t.w}-${t.l}${t.t ? '-' + t.t : ''}</td><td class="res ${t.res}">${t.res}</td><td class="num"><span${mark(t.pf, pfMax, pfMin, ['Most points for', 'Fewest points for'])}>${Math.round(t.pf)}</span></td><td class="num"><span${mark(t.pa, paMin, paMax, ['Fewest points against', 'Most points against'])}>${Math.round(t.pa)}</span></td><td class="tag"></td></tr>`; };
    // A labeled rule under the last team on the right side of each cutoff: the top two skip the first round, the top six make the playoffs.
    const cut = rank => rank === BYE_SPOTS ? `<tr class="cut"><td colspan="8"><span>First-round bye</span></td></tr>` : rank === PLAYOFF_SPOTS ? `<tr class="cut"><td colspan="8"><span>Playoff line</span></td></tr>` : '';
    const table = `<table>${head}<tbody>${now.map((t, i) => row(t, i) + cut(i + 1)).join('')}</tbody></table>`;
    // Regular-season weeks still to play once this one is in the books.
    const left = PLAYOFF_START_WEEK - 1 - hist.week;
    const toGo = left > 1 ? `${left} weeks left before playoffs` : left === 1 ? '1 week left before playoffs' : left === 0 ? 'last week before playoffs' : '';
    st.innerHTML = `<div class="hd"><span class="lab">${weekDone ? 'Standings' : 'Projected standings'} after Week ${hist.week}</span><span class="note">${toGo}<span class="sm">${toGo ? ' · ' : ''}lines mark the first-round bye and the playoff cut</span></span></div>` +
      table;
  }
  document.getElementById('band').classList.toggle('solo', !st.innerHTML);
}
const grid = document.getElementById('grid');
let hoverRaf = null;
// Hover over a chart: a guide line follows the cursor and the readout interpolates between samples.
function showHover(c, clientX){
  const d = HOVER[c.dataset.id]; if (!d || d.xs.length < 2) return;  // nothing to scrub on a single-point (upcoming) chart
  const svg = c.querySelector('svg'), r = svg.getBoundingClientRect();
  const xv = Math.min(Math.max((clientX - r.left) / r.width * d.W, d.xs[0]), d.xs[d.xs.length-1]);
  let i = 1; while (i < d.xs.length-1 && d.xs[i] < xv) i++;
  const x0 = d.xs[i-1], x1 = d.xs[i], f = x1 > x0 ? (xv - x0) / (x1 - x0) : 0;
  const v = d.vals[i-1] + (d.vals[i] - d.vals[i-1]) * f;
  const t = new Date(d.ts[i-1] + (d.ts[i] - d.ts[i-1]) * f);
  const g = svg.querySelector('.guide'); g.setAttribute('x1', xv.toFixed(1)); g.setAttribute('x2', xv.toFixed(1)); g.style.display = 'block';
  const tip = c.querySelector('.tip');
  tip.textContent = `${t.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})} · ${c.dataset.top} ${Math.round(v)}%`;
  tip.style.display = 'block';
}
function hideHover(c){ const g = c.querySelector('.guide'), t = c.querySelector('.tip'); if (g) g.style.display = 'none'; if (t) t.style.display = 'none'; }
grid.addEventListener('pointermove', e => {
  const c = e.target.closest('.chart'); if (!c) return;
  const x = e.clientX; if (hoverRaf) cancelAnimationFrame(hoverRaf);
  hoverRaf = requestAnimationFrame(() => { hoverRaf = null; showHover(c, x); });
});
grid.addEventListener('pointerout', e => { if (e.pointerType === 'touch') return;  // a lifted finger leaves the readout up
  const c = e.target.closest('.chart'); if (c && !(e.relatedTarget && c.contains(e.relatedTarget))) hideHover(c); });
// Touch: the chart is not a link. A tap or a sideways drag scrubs the readout, which stays up until the next touch somewhere else;
// the rest of the card still opens Yahoo. A mouse keeps hovering to scrub and clicking anywhere on the card, chart included, to open Yahoo.
let lastDownTouch = false, pinned = null;
const scrubbable = c => { const d = c && HOVER[c.dataset.id]; return !!(d && d.xs.length >= 2); };  // a single-point (upcoming) chart has nothing to scrub, so it stays a link
document.addEventListener('pointerdown', e => {
  lastDownTouch = e.pointerType === 'touch';
  const c = e.target.closest ? e.target.closest('.chart') : null;
  if (pinned && pinned !== c) { if (pinned.isConnected) hideHover(pinned); pinned = null; }
  if (lastDownTouch && scrubbable(c)) { pinned = c; showHover(c, e.clientX); }
});
grid.addEventListener('pointercancel', e => {  // the touch turned into a page scroll: drop the readout it opened
  if (e.pointerType !== 'touch' || !pinned) return;
  if (hoverRaf) { cancelAnimationFrame(hoverRaf); hoverRaf = null; }
  if (pinned.isConnected) hideHover(pinned); pinned = null;
});
grid.addEventListener('click', e => { if (lastDownTouch && scrubbable(e.target.closest('.chart'))) e.preventDefault(); });
document.getElementById('meta').addEventListener('click', e => { const a = e.target.closest('a[data-week]'); if (!a) return; e.preventDefault(); pickWeek(parseInt(a.dataset.week, 10) || null); });
load(); setInterval(load, 75000); // 48 API calls per hour per viewer, under GitHub's 60 limit
// Reload when a newer build of this page is published, so open tabs never run stale code.
const BUILD = '{{ site.time | date: "%s" }}';
setInterval(async () => {
  try {
    const r = await fetch(location.pathname, {cache:'no-store'}); if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '(\d+)'/);
    if (m && m[1] !== BUILD) location.reload();
  } catch(e) {}
}, 5*60000);
</script>
