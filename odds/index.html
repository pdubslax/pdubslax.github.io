<style>
/* Layout: scoreboard wall. One header strip, a punishment panel (blowout race + shotgun watch), then a grid of matchup tiles that stack on phones. */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --fav:#1d4ed8; --fav-soft:#e8eefc; --dog:#6b7280; --dog-soft:#f3f4f6; --up:#1d4ed8; --down:#9ca3af; --grid:#f3f4f7;
  --risk:#b45309; --risk-soft:#fff3e0; --lock:#b91c1c; --lock-soft:#fdecec; --win:#15803d; --win-soft:#e6f4ea; --alt:#b7791f; --alt-soft:#fdf0c2;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.eyebrow{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:grid;gap:2px;text-align:right}
.meta b{color:var(--ink);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--fav);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}}
.tile .lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile .who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
a.card{color:inherit;text-decoration:none;cursor:pointer}
a.card:hover{border-color:var(--fav)}
.nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);padding:12px 16px 10px;display:grid;gap:6px;min-width:0}
.rowtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rowtop b{color:var(--ink);font-weight:500}
.card.done .rowtop b{color:var(--win)}
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:14px}
.strip .mid{min-width:0;display:grid;gap:1px}
.strip .key{font-size:12px;color:var(--muted);text-align:right;line-height:1.4;padding-left:4px}
.strip .key b{display:block;font-family:var(--mono);font-weight:500;color:var(--ink);font-size:12px}
.strip .key em{font-style:normal;font-family:var(--mono);font-size:11.5px;margin-left:6px;color:var(--muted)}
.strip .key em.up{color:var(--win)} .strip .key em.down{color:var(--lock)}

.card.done .key em.up{color:var(--win)}
.strip .pct{min-width:64px}
.strip .nm{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.strip .rec{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.strip .pct{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.strip .pct small{font-size:16px;font-weight:600}
.strip .sub{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}

.strip.top .pct,.strip.top .nm{color:var(--fav)} .strip.bot .pct,.strip.bot .nm{color:var(--alt)}
.strip.bot{border-top:1px solid var(--line);padding-top:8px}
.strip.top{padding-bottom:2px}
.chart{position:relative}
.chart svg{width:100%;height:96px;display:block;max-width:100%}
.chart svg *{pointer-events:none}
.chart .tip{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel);padding:1px 5px;border:1px solid var(--line);border-radius:3px;pointer-events:none;display:none;font-variant-numeric:tabular-nums;white-space:nowrap}

.delta{font-weight:500}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.chip{display:inline-block;font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--fav-soft);color:var(--fav)}
.chip.lock{background:var(--win-soft);color:var(--win)}
.card.done{--fav:var(--win);--fav-soft:#cfe9d6;--alt:var(--win);--alt-soft:#cfe9d6;--grid:#e3f3e7;--dog-soft:#e3ebe5;--line:#bfe0c8;background:#f1faf3;border-color:#bfe0c8}
.card.done .chip.lock{background:#d6efdc}
.card.done .rowtop{color:var(--win)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.empty{background:var(--panel);border:1px dashed var(--line);padding:28px;text-align:center;color:var(--muted)}
.shot{background:var(--panel);border:1px solid var(--line);padding:12px 16px;display:grid;gap:8px;min-width:0}
.shot .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.shot .lab{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.shot .note{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.shot .cols{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px 28px}
.shot .blow li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:10px}
.shot .blow .big{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;min-width:64px}
.shot .blow li:first-child .big{font-size:34px}
.shot .blow .who{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot .blow li:first-child .who{color:var(--ink);font-weight:600;font-size:14px}
.shot .col{min-width:0;display:grid;gap:6px;align-content:start}
.shot .col .lab{display:flex;align-items:center;gap:8px}
.shot ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
@media (max-width:680px){.shot .cols{grid-template-columns:1fr}}
.shot li{font-size:14px;border-top:1px solid var(--line);padding-top:6px;min-width:0}
.shot .who{font-weight:600;overflow-wrap:anywhere}
.shot .who small{font-weight:400;color:var(--muted);font-size:12.5px}
.shot .pts{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.chip.risk{background:var(--risk-soft);color:var(--risk)} .chip.beer{background:var(--lock-soft);color:var(--lock)}
.shot .none{color:var(--muted);font-size:14px}
.meta .crumbs a{color:var(--fav);text-decoration:none;font-weight:500}
.meta .crumbs a:hover{text-decoration:underline}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.grid{grid-template-columns:1fr}.meta{text-align:left}}

<body>

<div class="wrap">
  <header>
    <div><p class="eyebrow">Harry Koch Memorial Cup</p><h1>Live Fantasy Odds</h1></div>
    <div class="meta" id="meta"></div>
  </header>
  <section class="shot" id="shot" aria-label="Punishment watch"></section>
  <section class="grid" id="grid" aria-label="Matchups"></section>
  <footer><span>Win odds and projections are Yahoo's, sampled about once a minute during game windows. This page refreshes itself.</span></footer>
</div>
<script>
const REPO = 'pdubslax/pdubslax.github.io', FILE = 'data/odds/current.json';
const REF_URL = 'https://api.github.com/repos/' + REPO + '/commits/odds-data';
const RAW_URL = 'https://raw.githubusercontent.com/' + REPO + '/odds-data/' + FILE;
let lastSha = null, lastJson = null, apiBlockedUntil = 0;
const FIRST_WEEK = 6;            // first week the sampler recorded
let latest = null;               // {hist, nxt, sha} from the newest data commit
let viewWeek = (location.hash.match(/^#week(\d+)$/)||[])[1] ? parseInt(RegExp.$1, 10) : null;  // a past week the viewer picked, else auto
const pastCache = {};
async function fetchJson(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function show(hist, nxt, sha){ latest = {hist, nxt, sha: sha || (latest && latest.sha)}; renderView(); }
// Decide what the board shows: a past week the viewer picked, the upcoming week once the current one is fully decided, or the live week.
async function renderView(){
  if (!latest) return;
  const {hist, nxt, sha} = latest;
  if (viewWeek && viewWeek !== hist.week) {
    let past = pastCache[viewWeek];
    if (!past && sha) { try { past = await fetchJson('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/data/odds/week' + viewWeek + '.json'); pastCache[viewWeek] = past; } catch(e) {} }
    if (past) { renderOnce(past, 'past', hist.week); return; }
    viewWeek = null; history.replaceState(null, '', location.pathname);
  }
  const lastS = hist.samples && hist.samples[hist.samples.length-1];
  const allDone = lastS && lastS.matchups.every(decidedOf);
  if (allDone && nxt && nxt.week > hist.week && (nxt.matchups||[]).length) {
    const shift = 7*86400000, mv = s => new Date(new Date(s).getTime() + shift).toISOString();
    const up = {week: nxt.week, samples: [{ts: nxt.ts, week: nxt.week, matchups: nxt.matchups}],
                segments: (hist.segments||[]).map(g => ({...g, start: mv(g.start), end: mv(g.end)})), ticks: (hist.ticks||[]).map(k => ({at: mv(k.at)}))};
    renderOnce(up, 'upcoming', hist.week); return;
  }
  renderOnce(hist, 'live', hist.week);
}
function renderOnce(hist, mode, curWeek){ const txt = JSON.stringify([hist, mode, viewWeek]); if (txt === lastJson) return; lastJson = txt; render(hist, mode, curWeek); }
function pickWeek(w){ viewWeek = w; lastJson = null; history.replaceState(null, '', w ? '#week' + w : location.pathname); renderView(); }
const decidedOf = m => { const lp = m.leftPct; const leftAhead = m.leftScore > m.rightScore, rightAhead = m.rightScore > m.leftScore;
  return (m.leftRem===0 && m.rightRem===0) || ((lp===100 || lp===0) && (m.leftRem===0 || m.rightRem===0)) || (lp>=99 && m.rightRem===0) || (lp<=1 && m.leftRem===0) || (leftAhead && m.rightRem===0) || (rightAhead && m.leftRem===0); };
async function load(){
  try {
    if (Date.now() > apiBlockedUntil) {
      // Latest commit on the data branch: GitHub's API is always fresh. 60 calls per hour per viewer address, so poll it once a minute and back off on a refusal.
      const r = await fetch(REF_URL, {headers:{'Accept':'application/vnd.github.sha'}, cache:'no-store'});
      if (r.ok) {
        const sha = (await r.text()).trim();
        if (sha === lastSha) return;
        let hist;
        try { hist = await fetchJson('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/' + FILE); }
        catch(e) { hist = await fetchJson('https://raw.githubusercontent.com/' + REPO + '/' + sha + '/' + FILE); }
        let nxt = null; try { nxt = await fetchJson('https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/data/odds/next.json'); } catch(e) {}
        lastSha = sha; show(hist, nxt, sha); return;
      }
      if (r.status === 403 || r.status === 429) apiBlockedUntil = Date.now() + 10*60*1000;
    }
    // Fallback: the branch file through GitHub's CDN, which can lag up to 5 minutes.
    show(await fetchJson(RAW_URL + '?t=' + Date.now()), null, null);
  } catch(e){ const g=document.getElementById('grid'); if(!g.children.length) g.innerHTML='<div class="empty">No samples yet. The sampler runs about once a minute during game windows.</div>'; }
}
const LEAGUE = 932579;
const HOVER = {};  // per-matchup sample points for the chart hover readout
const MANAGERS = {1:'Nick', 2:'Hy', 3:'Patrick', 4:'Matt #1', 5:'Keith', 6:'Daniel', 7:'Jimmy', 8:'Alex', 9:'Scott', 10:'Kyle', 11:'Skylar', 12:'Matt #2'};
const sideIds = m => m.id.split('v').map(Number);
const firstName = (m, side) => MANAGERS[sideIds(m)[side]] || '';
const shortName = (m, side) => firstName(m, side) || (side===0 ? m.left : m.right);
const DAYS = {Thu:0,Fri:1,Sat:2,Sun:3,Mon:4,Tue:5,Wed:6};
const dayOf = a => ((a.game||'').match(/^(Thu|Fri|Sat|Sun|Mon|Tue|Wed)/)||[])[1];
// The next game day across a whole slate, so 'still to come' lists only the players in the next games (Thursday's starters, say).
function nextDay(matchups){ const ds = matchups.flatMap(m => [...(m.leftActive||[]), ...(m.rightActive||[])]).filter(a => a.state==='pending').map(dayOf).filter(Boolean); if (!ds.length) return null; const first = Math.min(...ds.map(d => DAYS[d])); return Object.keys(DAYS).find(k => DAYS[k] === first); }
function render(hist, mode, curWeek){
  if(!hist.samples || !hist.samples.length){ document.getElementById('grid').innerHTML='<div class="empty">No samples yet this week. The sampler runs about once a minute during game windows.</div>'; return; }
  const S = hist.samples; const last = S[S.length-1]; const first = S[0]; const prev = S.length>1 ? S[S.length-2] : null;
  const fmtT = ts => new Date(ts).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'});
  const ago = ts => { const m = Math.round((Date.now()-new Date(ts))/60000); return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'; };
  const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const topWeek = Math.max(hist.week, curWeek, (latest && latest.nxt && latest.nxt.week) || 0);
  const weeks = []; for (let w = FIRST_WEEK; w <= topWeek; w++) weeks.push(w);
  const crumbs = weeks.map(w => w === hist.week ? `<b>Week ${w}</b>` : `<a href="#week${w}" data-week="${w}">${w}</a>`).join(' · ');
  const status = mode === 'past' ? `final · ${S.length} samples` : mode === 'upcoming' ? `projections as of <b>${esc(fmtT(last.ts))}</b>` : `<span class="live"><i></i>last sample <b>${esc(fmtT(last.ts))}</b> (${ago(last.ts)})</span>`;
  document.getElementById('meta').innerHTML = `<span class="crumbs">${crumbs}${mode === 'past' ? ' · <a href="#" data-week="0">back to current</a>' : ''}</span><span>${status}</span>`;
  // blowout ribbon: projected margin, biggest first
  const margins = last.matchups.map(m => { const l = m.leftProj>=m.rightProj; return {lead: shortName(m, l?0:1), trail: shortName(m, l?1:0), margin: Math.abs(m.leftProj-m.rightProj)}; }).sort((a,b)=>b.margin-a.margin).slice(0,3);
  const blowHtml = `<ul>${margins.map((x,i)=>`<li><span class="big">${x.margin.toFixed(2)}</span><span class="who" title="${esc(x.lead)} over ${esc(x.trail)}">${esc(x.lead)} over ${esc(x.trail)}</span></li>`).join('')}</ul>`;
  // shotgun watch: starters at zero or below. Locked once their game is final, or once the whole week is decided.
  const weekDone = last.matchups.every(m => m.leftRem===0 && m.rightRem===0);
  // A live game only counts from halftime on; before that a zero is just a slow start. Injury tags, byes, empty slots and finals always count.
  const INACTIVE = ['O','IR','IR-R','PUP','SUSP','NFI','NA'];
  const inPlay = x => x.state === 'final' || x.state === 'bye' || x.state === 'empty' || INACTIVE.includes(x.tag) || (x.state === 'live' && /^(Half|3rd|4th|OT)/.test(x.game || ''));
  const shots = last.matchups.flatMap(m => (m.shotgun || []).filter(inPlay).map(x => ({...x, label: (firstName(m, x.manager===m.left?0:1) ? firstName(m, x.manager===m.left?0:1) + ' - ' : '') + x.manager}))).map(x => ({...x, locked: x.locked || weekDone}));
  const line = x => `<li><span class="who">${esc(x.label)} <small>${esc(x.player)}${x.pos?' · '+esc(x.pos):''}${x.tag?' · '+esc(x.tag):''}${x.game&&x.state!=='final'?' · '+esc(x.game):''}</small></span></li>`;
  shots.sort((a,b)=>a.pts-b.pts);
  const locked = shots.filter(x=>x.locked), risk = shots.filter(x=>!x.locked);
  const col = (title, chipCls, items, empty) => `<div class="col"><span class="lab"><span class="chip ${chipCls}">${title}</span></span>${items.length ? `<ul>${items.map(line).join('')}</ul>` : `<div class="none">${empty}</div>`}</div>`;
  document.getElementById('shot').innerHTML = `<div class="hd"><span class="lab">Punishment watch</span></div><div class="cols">` +
    `<div class="col blow"><span class="lab"><span class="chip">Biggest blowout</span></span>${blowHtml}</div>` +
    col('🍺🔫 shotgun confirmed', 'beer', locked, 'None yet.') + col('shotgun at risk', 'risk', risk, 'Nobody at zero past halftime.') + `</div>`;
  const series = id => S.map(s => { const m = s.matchups.find(x=>x.id===id); return m ? m.leftPct : null; });
  // cards sorted by the favorite's win percentage, then projected margin as the tiebreaker
  const cards = last.matchups.map(m => ({m, fav: Math.max(m.leftPct, 100-m.leftPct), margin: Math.abs(m.leftProj-m.rightProj)})).sort((a,b)=>b.fav-a.fav || b.margin-a.margin);
  const SEG = hist.segments.map(g => ({label:g.label, a:new Date(g.start).getTime(), b:new Date(g.end).getTime() + 100*60000, w:g.w}));
  const GAP = 0.012; const usable = 1 - GAP*(SEG.length-1);
  SEG.reduce((off,g)=>{ g.x0 = off; g.x1 = off + g.w*usable; return g.x1 + GAP; }, 0);
  const frac = t => { for (let i = 0; i < SEG.length; i++){ const g = SEG[i]; if (t < g.a) return i === 0 ? g.x0 : SEG[i-1].x1; if (t <= g.b) return g.x0 + (g.x1-g.x0)*(t-g.a)/(g.b-g.a); } return SEG[SEG.length-1].x1; };
  const tsList = S.map(s => new Date(s.ts).getTime());
  function spark(vals, id){
    const W=320,H=110,pl=6,pr=6,pt=8,pb=20; const x=t=> pl+(W-pl-pr)*frac(t); const y=v=> pt+(H-pt-pb)*(1-v/100);
    // Smooth: centered rolling average over 5 samples, endpoint pinned to the latest real value, drawn as a monotone curve.
    const pts = []; vals.forEach((v,i)=>{ if(v==null) return; const q = {t:tsList[i], v, px:x(tsList[i])}; if (pts.length && Math.abs(pts[pts.length-1].px - q.px) < 0.01) pts[pts.length-1] = q; else pts.push(q); });  // only samples clamped to the same band edge merge
    const sm = pts.map((p,i)=>{ if(i===pts.length-1) return p.v; const lo=Math.max(0,i-2), hi=Math.min(pts.length-1,i+2); let s=0,c=0; for(let k=lo;k<=hi;k++){ s+=pts[k].v; c++; } return s/c; });
    const P = pts.map((p,i)=>({x:x(p.t), y:y(sm[i])}));
    if (id) HOVER[id] = {W, xs: pts.map(p=>x(p.t)), ts: pts.map(p=>p.t), vals: pts.map(p=>p.v)};
    let d='';
    if (P.length){ d = 'M'+P[0].x.toFixed(1)+' '+P[0].y.toFixed(1);
      const n=P.length, m=[], dx=[], dy=[];
      for(let i=0;i<n-1;i++){ dx[i]=P[i+1].x-P[i].x; dy[i]=(P[i+1].y-P[i].y)/(dx[i]||1e-6); }
      for(let i=0;i<n;i++){ if(i===0) m[i]=dy[0]||0; else if(i===n-1) m[i]=dy[n-2]||0; else m[i]=(dy[i-1]*dy[i]<=0)?0:(dy[i-1]+dy[i])/2; }
      for(let i=0;i<n-1;i++){ const h3=dx[i]/3; d += ` C${(P[i].x+h3).toFixed(1)} ${(P[i].y+m[i]*h3).toFixed(1)} ${(P[i+1].x-h3).toFixed(1)} ${(P[i+1].y-m[i+1]*h3).toFixed(1)} ${P[i+1].x.toFixed(1)} ${P[i+1].y.toFixed(1)}`; }
    }
    const n=vals.length, lastV=vals[n-1], lastX=x(tsList[n-1]);
    const bands = SEG.map((g,i)=>{ const x0=pl+(W-pl-pr)*g.x0, x1=pl+(W-pl-pr)*g.x1; return `<rect x="${x0.toFixed(1)}" y="${pt}" width="${(x1-x0).toFixed(1)}" height="${H-pt-pb}" fill="var(--grid)" opacity="${i%2?0.55:0.25}"/><text x="${((x0+x1)/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--muted)">${g.label}</text>`; }).join('');
    const ticks = hist.ticks.map(k => { const tx = x(new Date(k.at).getTime()); return `<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="1"/>`; }).join('');
    const area = n>1 ? d+` L${lastX.toFixed(1)} ${y(50)} L${x(tsList[0]).toFixed(1)} ${y(50)} Z` : '';
    const cid = 'c' + Math.random().toString(36).slice(2,8);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Win probability across the week">
      ${bands}${ticks}
      <line x1="${pl}" x2="${W-pr}" y1="${y(50)}" y2="${y(50)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
      ${area?`<clipPath id="${cid}a"><rect x="0" y="0" width="${W}" height="${y(50)}"/></clipPath><clipPath id="${cid}b"><rect x="0" y="${y(50)}" width="${W}" height="${H-y(50)}"/></clipPath>
      <path d="${area}" fill="var(--fav-soft)" clip-path="url(#${cid}a)"/><path d="${area}" fill="var(--alt-soft)" clip-path="url(#${cid}b)"/>
      <path d="${d}" fill="none" stroke="var(--fav)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${cid}a)"/>
      <path d="${d}" fill="none" stroke="var(--alt)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${cid}b)"/>`:`<path d="${d}" fill="none" stroke="var(--fav)" stroke-width="2"/>`}
      <circle cx="${lastX.toFixed(1)}" cy="${y(lastV)}" r="3.5" fill="${lastV>=50?'var(--fav)':'var(--alt)'}"/>
      <line class="guide" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>
    </svg><div class="tip"></div>`;
  }
  const dstr = (a,b) => { if(a==null||b==null) return ''; const d=b-a; const s=(d>0?'+':'')+d; return `<span class="delta ${d>0?'up':d<0?'down':''}">${s===''?'':s}</span>`; };
  const upDay = nextDay(last.matchups);
  document.getElementById('grid').innerHTML = cards.map(({m}) => {
    const lp = m.leftPct, rp = 100-lp; const leftFav = lp>=rp;
    // Current favorite always on top; the chart is drawn from the top team's point of view, so a crossover shows where they took the lead.
    const flip = lp < 50;
    const vals = series(m.id).map(v => v==null ? null : (flip ? 100-v : v));
    // Decided: Yahoo says 100%, both sides are out of players, the trailing side has no players left while the leader is already ahead,
    const leftAhead = m.leftScore > m.rightScore, rightAhead = m.rightScore > m.leftScore;
    // Also decided at 99/1 when only the leading side still has players to play.
    const decided = (m.leftRem===0 && m.rightRem===0) || ((lp===100 || lp===0) && (m.leftRem===0 || m.rightRem===0)) || (lp>=99 && m.rightRem===0) || (lp<=1 && m.leftRem===0) || (leftAhead && m.rightRem===0) || (rightAhead && m.leftRem===0);
    const lm = m.leftProj-m.rightProj;
    // Key players: current points, green when Yahoo's live projection beats the pregame one (on pace), red when behind it.
    const ptsTag = a => a.state==='live' && a.pts!=null ? `<em class="${a.live>a.proj?'up':a.live<a.proj?'down':''}">${a.pts.toFixed(1)}</em>` : '';
    // Players in progress first; when none are playing, stage the ones still to come (Sunday night that means the MNF starters).
    const pick = act => { const a = act||[]; const live = a.filter(x=>x.state==='live'); return live.length ? live : a.filter(x=>x.state==='pending' && (!upDay || dayOf(x)===upDay)); };
    const keys = (act,rem) => `<b>${rem} left</b>` + pick(act).map(a=>`<span>${esc(a.pos||a.slot)} ${esc(a.player)}${ptsTag(a)}</span>`).join('');
    const strip=(first,name,rec,pct,score,proj,rem,fav,cls,act)=>`<div class="strip ${cls} ${fav?'isfav':'isdog'}"><div class="pct">${pct}<small>%</small></div><div class="mid"><div class="nm" title="${esc(name)}">${esc(first||name)}<span class="rec">${esc(rec)}</span></div><div class="sub"><b>${score.toFixed(2)}</b> now · ${proj.toFixed(2)} proj</div></div><div class="key">${keys(act,rem)}</div></div>`;
    const leadName = shortName(m, lm>=0?0:1); const [ida, idb] = sideIds(m);
    const cm = m.leftScore-m.rightScore; const nowName = shortName(m, cm>=0?0:1);
    return `<a class="card${decided?' done':''}" href="/odds/open/?week=${hist.week}&mid1=${ida}&mid2=${idb}" target="_blank" rel="noopener">
      <div class="rowtop">${decided?'<span class="chip lock">✅ Decided</span>':mode==='upcoming'?'<span class="chip">Upcoming</span>':'<span class="chip">Live</span>'}<span>proj margin <b>${Math.abs(lm).toFixed(2)}</b> · ${esc(leadName)}</span></div>
      ${flip ? strip(firstName(m,1),m.right,m.rightRec,rp,m.rightScore,m.rightProj,m.rightRem,true,'top',m.rightActive) : strip(firstName(m,0),m.left,m.leftRec,lp,m.leftScore,m.leftProj,m.leftRem,true,'top',m.leftActive)}
      <div class="chart" data-id="${m.id}" data-top="${esc(flip ? shortName(m,1) : shortName(m,0))}">${spark(vals, m.id)}</div>
      ${flip ? strip(firstName(m,0),m.left,m.leftRec,lp,m.leftScore,m.leftProj,m.leftRem,false,'bot',m.leftActive) : strip(firstName(m,1),m.right,m.rightRec,rp,m.rightScore,m.rightProj,m.rightRem,false,'bot',m.rightActive)}
    </a>`;
  }).join('');
}
function showHover(c, clientX){
  const d = HOVER[c.dataset.id]; if (!d || !d.xs.length) return;
  const svg = c.querySelector('svg'), r = svg.getBoundingClientRect();
  const xv = Math.min(Math.max((clientX - r.left) / r.width * d.W, d.xs[0]), d.xs[d.xs.length-1]);
  let i = 1; while (i < d.xs.length-1 && d.xs[i] < xv) i++;
  const x0 = d.xs[i-1], x1 = d.xs[i], f = x1 > x0 ? (xv - x0) / (x1 - x0) : 0;
  const v = d.vals[i-1] + (d.vals[i] - d.vals[i-1]) * f;
  const t = new Date(d.ts[i-1] + (d.ts[i] - d.ts[i-1]) * f);
  const g = svg.querySelector('.guide'); g.setAttribute('x1', xv.toFixed(1)); g.setAttribute('x2', xv.toFixed(1)); g.style.display = 'block';
  const tip = c.querySelector('.tip');
  tip.textContent = `${t.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})} · ${c.dataset.top} ${Math.round(v)}%`;
  tip.style.display = 'block';
}
function hideHover(c){ const g = c.querySelector('.guide'), t = c.querySelector('.tip'); if (g) g.style.display = 'none'; if (t) t.style.display = 'none'; }
grid.addEventListener('pointermove', e => {
  const c = e.target.closest('.chart'); if (!c) return;
  const x = e.clientX; if (hoverRaf) cancelAnimationFrame(hoverRaf);
  hoverRaf = requestAnimationFrame(() => { hoverRaf = null; showHover(c, x); });
});
grid.addEventListener('pointerout', e => { const c = e.target.closest('.chart'); if (c && !(e.relatedTarget && c.contains(e.relatedTarget))) hideHover(c); });
document.getElementById('meta').addEventListener('click', e => { const a = e.target.closest('a[data-week]'); if (!a) return; e.preventDefault(); pickWeek(parseInt(a.dataset.week, 10) || null); });
load(); setInterval(load, 75000); // 48 API calls per hour per viewer, under GitHub's 60 limit
// Reload when a newer build of this page is published, so open tabs never run stale code.
const BUILD = '{{ site.time | date: "%s" }}';
setInterval(async () => {
  try {
    const r = await fetch(location.pathname, {cache:'no-store'}); if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '(\d+)'/);
    if (m && m[1] !== BUILD) location.reload();
  } catch(e) {}
}, 5*60000);
</script>
