name: odds sampler
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long this run keeps sampling (minutes)'
        default: '300'
  schedule:
    # UTC. Thu night ET (TNF), Sunday afternoon through SNF, and Monday night ET (MNF), every 5 minutes.
    - cron: '*/5 0-4 * * 5'
    - cron: '*/5 17-23 * * 0'
    - cron: '*/5 0-5 * * 1'
    - cron: '*/5 0-4 * * 2'
    # One daily off-window sample (11 AM ET, Tue-Sat) so the week flips and the next slate stages before Thursday.
    - cron: '0 15 * * 2-6'
concurrency:
  group: odds-sampler
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: odds-data
          path: odds-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.47.0
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Sample once a minute for this window
        run: |
          cd odds-data
          git config user.name "odds-sampler"
          git config user.email "odds-sampler@users.noreply.github.com"
          cd ..
          mins="${{ github.event.inputs.minutes || '300' }}"
          end=$((SECONDS + $(python -c "print(int(float('$mins')*60))")))
          while :; do
            t0=$SECONDS
            if python tools/odds_sampler.py --in-window >/dev/null; then gap=60; else gap=1200; fi
            out=$(python tools/odds_sampler.py odds-data/data/odds 2>&1) || true
            echo "$(date -u +%H:%M) $out"
            ( cd odds-data && git add data/odds && if git diff --cached --quiet; then echo "nothing to commit"; else
                git commit -qm "odds sample $(date -u +%Y-%m-%dT%H:%MZ)" && (git pull --rebase -q origin odds-data || true) && git push -q; fi )
            [ $SECONDS -ge $end ] && break
            w=$((gap-(SECONDS-t0))); [ $w -gt 0 ] && sleep $w
          done
      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's cron skipped whole game windows twice, so the sampler keeps itself alive: every run queues its successor
          # (the concurrency group holds exactly one pending run). Inside a game window it samples every minute; outside it idles
          # and refreshes the preview every 20 minutes. The crons remain only as restarters if the chain ever breaks.
          gh workflow run odds.yml --repo "$GITHUB_REPOSITORY" -f minutes=300 && echo "queued next run"
